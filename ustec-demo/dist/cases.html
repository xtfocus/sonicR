<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="cases.title">Analysis cases</title>
    <style>
      :root {
        --bg: #131722;
        --panel: #0f1520;
        --border: #2a3551;
        --text: #d1d4dc;
        --muted: #8a92a6;
        --accent: #4c6ef5;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        line-height: 1.55;
        padding: 32px 16px 64px;
      }
      main {
        max-width: 980px;
        margin: 0 auto;
      }
      h1 {
        font-size: 26px;
        margin-bottom: 6px;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 12px 0 18px;
      }
      .toolbar select,
      .toolbar button {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 12px;
        cursor: pointer;
      }
      .api-base {
        color: var(--muted);
        font-size: 13px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 14px;
      }
      th,
      td {
        border: 1px solid var(--border);
        padding: 8px 12px;
        text-align: left;
        vertical-align: top;
      }
      th {
        background: var(--panel);
      }
      a {
        color: var(--accent);
      }
      .muted {
        color: var(--muted);
      }
      .error {
        color: #ef5350;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
      }
      .back {
        display: inline-block;
        margin-top: 22px;
        color: var(--accent);
      }
      code {
        background: #1a2233;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 5px;
        font-size: 0.9em;
      }
    </style>
    <script type="module" crossorigin src="/assets/cases-D2fbmd5S.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/i18n-kOI4Yrud.js">
  </head>
  <body>
    <main>
      <h1 data-i18n="cases.title">Analysis cases</h1>
      <div class="toolbar">
        <label for="lang-select"><span data-i18n="app.lang">Language</span>:</label>
        <select id="lang-select">
          <option value="en">English</option>
          <option value="vi">Tiếng Việt</option>
        </select>
        <button id="refresh" data-i18n="cases.refresh">Refresh</button>
        <span class="api-base" id="api-base"></span>
      </div>
      <div id="status"></div>
      <table id="cases-table">
        <thead>
          <tr>
            <th data-i18n="cases.case">Case</th>
            <th data-i18n="cases.charts">Charts</th>
            <th data-i18n="cases.bars">Pinned bars</th>
            <th data-i18n="cases.created">Created (UTC)</th>
            <th data-i18n="cases.open">Report</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <a class="back" href="/" data-i18n="help.back">← back to the chart</a>
    </main>
  </body>
</html>
