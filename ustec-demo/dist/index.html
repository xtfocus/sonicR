<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="app.title">USTEC M1 – Lightweight Charts</title>
    <style>
      :root {
        --ui-scale: 2.0;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #131722;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #chart {
        width: 100vw;
        height: 100vh;
      }
      #overlay-ui {
        font-size: 28px;
      }
      #overlay-ui button,
      #overlay-ui select,
      #overlay-ui input,
      #overlay-ui label {
        font-size: 26px;
      }
    </style>
    <script type="module" crossorigin src="/assets/main-D6gD7SjR.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/i18n-B2XqYbNA.js">
  </head>
  <body>
    <div
      id="overlay-ui"
      style="
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 10;
        color: #d1d4dc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        user-select: none;
        pointer-events: none;
      "
    >
      <div style="pointer-events: auto;">
        <label>
          <span data-i18n="app.timeframe">Timeframe:</span>
          <select
            id="timeframe"
            style="
              margin-left: 8px;
              background: #0f1520;
              color: #d1d4dc;
              border: 1px solid #2a3551;
              border-radius: 6px;
              padding: calc(6px * var(--ui-scale)) calc(10px * var(--ui-scale));
            "
          >
            <!-- options are generated from TIMEFRAMES (src/ustec-data.ts) -->
          </select>
        </label>
        <button
          id="replay-mode-toggle"
          style="
            margin-left: 10px;
            background: #0f1520;
            color: #d1d4dc;
            border: 1px solid #2a3551;
            border-radius: 6px;
            padding: calc(6px * var(--ui-scale)) calc(10px * var(--ui-scale));
            cursor: pointer;
          "
        >
          <span data-i18n="replay.enter">Enter Replay</span>
        </button>
        <button
          id="select-range-toggle"
          style="
            margin-left: 10px;
            background: #0f1520;
            color: #d1d4dc;
            border: 1px solid #2a3551;
            border-radius: 6px;
            padding: calc(6px * var(--ui-scale)) calc(10px * var(--ui-scale));
            cursor: pointer;
          "
        >
          <span data-i18n="select.range">Select Range</span>
        </button>
        <button
          id="capture-png"
          style="
            margin-left: 10px;
            background: #0f1520;
            color: #d1d4dc;
            border: 1px solid #2a3551;
            border-radius: 6px;
            padding: calc(6px * var(--ui-scale)) calc(10px * var(--ui-scale));
            cursor: pointer;
          "
        >
          <span data-i18n="app.capture">Capture PNG</span>
        </button>
        <a
          href="/help.html"
          target="_blank"
          style="
            margin-left: 10px;
            background: #0f1520;
            color: #d1d4dc;
            border: 1px solid #2a3551;
            border-radius: 6px;
            padding: calc(6px * var(--ui-scale)) calc(10px * var(--ui-scale));
            cursor: pointer;
            text-decoration: none;
          "
        >
          <span data-i18n="app.help">Help</span></a
        >
        <label style="margin-left: 10px;">
          <span data-i18n="app.lang">Language</span>:
          <select
            id="lang-select"
            style="
              margin-left: 6px;
              background: #0f1520;
              color: #d1d4dc;
              border: 1px solid #2a3551;
              border-radius: 6px;
              padding: calc(4px * var(--ui-scale)) calc(8px * var(--ui-scale));
            "
          >
            <option value="en">English</option>
            <option value="vi">Tiếng Việt</option>
          </select>
        </label>
      </div>

      <div
        id="replay-controls"
        style="
          margin-top: 8px;
          display: flex;
          align-items: center;
          gap: 8px;
          pointer-events: auto;
        "
      >
        <button
          id="replay-play"
          style="
            background: #0f1520;
            color: #d1d4dc;
            border: 1px solid #2a3551;
            border-radius: 6px;
            padding: calc(4px * var(--ui-scale)) calc(10px * var(--ui-scale));
            cursor: pointer;
          "
        >
          <span data-i18n="replay.play">Play</span>
        </button>
        <button
          id="replay-step"
          style="
            background: #0f1520;
            color: #d1d4dc;
            border: 1px solid #2a3551;
            border-radius: 6px;
            padding: calc(4px * var(--ui-scale)) calc(10px * var(--ui-scale));
            cursor: pointer;
          "
        >
          <span data-i18n="replay.step">Step</span>
        </button>
        <label>
          <span data-i18n="replay.speed">Speed:</span>
          <select
            id="replay-speed"
            style="
              margin-left: 6px;
              background: #0f1520;
              color: #d1d4dc;
              border: 1px solid #2a3551;
              border-radius: 6px;
              padding: calc(4px * var(--ui-scale)) calc(8px * var(--ui-scale));
            "
          >
            <option value="1">1x</option>
            <option value="2">2x</option>
            <option value="5" selected>5x</option>
            <option value="10">10x</option>
          </select>
        </label>
      </div>
      <div style="margin-top: 6px; pointer-events: auto;">
        <input
          id="replay-position"
          type="range"
          min="0"
          max="1000"
          value="0"
          style="width: calc(280px * var(--ui-scale));"
        />
      </div>
      <div style="margin-top: 6px; pointer-events: auto; display: flex; align-items: center; gap: 8px;">
        <label for="replay-jump-datetime"><span data-i18n="replay.jump">Jump time (UTC):</span></label>
        <input
          id="replay-jump-datetime"
          type="text"
          inputmode="numeric"
          placeholder="DD/MM/YYYY HH:mm"
          style="
            background: #0f1520;
            color: #d1d4dc;
            border: 1px solid #2a3551;
            border-radius: 6px;
            padding: calc(4px * var(--ui-scale)) calc(8px * var(--ui-scale));
            width: calc(170px * var(--ui-scale));
          "
        />
      </div>

      <div id="indicators-menu" style="margin-top: 8px; pointer-events: auto;"></div>
    </div>
    <div id="chart"></div>
  </body>
</html>
